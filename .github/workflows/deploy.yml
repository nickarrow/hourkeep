name: Deploy to GitHub Pages

# While v2 is built, hourkeep.app serves one static placeholder page from public/.
# There is nothing to install or build. When v2's app arrives this job gains its
# install, test and build steps and uploads the build output instead of public/.
# See docs/decisions/0001-set-aside-v1-in-the-same-repository.md.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run waits rather than cancelling one in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves 404.html for any path it cannot find, so every old v1 link
      # (/tracking, /export and the rest) lands on the placeholder instead of a dead end.
      # Copied at deploy time so the two pages cannot drift apart.
      - name: Publish the placeholder as the 404 page too
        run: |
          test -s public/index.html
          cp public/index.html public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
