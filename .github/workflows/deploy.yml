name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned EXACTLY, not `"22"`. The test toolchain's floor is jsdom 30, which
          # declares `^22.22.2 || ^24.15.0 || >=26.0.0`; undici 8 (via jsdom) declares
          # `>=22.19.0`. `package.json` `engines.node` is `>=22.22.2` to match.
          #
          # Raised from `"22"` in W6a (2026-09-03). The old floor was `>=22`, which
          # admits 22.18.0 — the version this repo was developed on — so all 668 tests
          # passed on an engine jsdom declares UNSUPPORTED. That is luck, not
          # verification: an EBADENGINE is a warning npm does not fail on (no `.npmrc`,
          # so `engine-strict` is off), so `npm ci` looked clean while the suite ran on
          # an unsupported runtime. `"22"` on the runner also resolved to the latest
          # 22.x unpinned, which is the same moving-target objection the CHANGELOG
          # raises against caret ranges for linters. 22.23.2 is the current 22.x LTS
          # security release (2026-07-29) and satisfies both declarations.
          node-version: "22.23.2"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Quality gates run BEFORE the build, so a failure is reported against the
      # thing that broke rather than as a build error.
      #
      # These did not run in CI before, which meant the ADR-0003 no-verdict guard
      # protected nothing on `main` — it could only fail on a developer's machine.
      # For an app whose copy tells people whether they may keep their health
      # coverage, a guard that does not gate deployment is decoration.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
