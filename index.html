<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HourKeep - Medicaid notice organizer</title>
    <meta name="description" content="A browser-only organizer for a Medicaid notice: notice details, requested months, evidence descriptions, hours arithmetic and a printable packet. The state makes all determinations." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-aeblack-50 text-aeblack-900">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-white focus:p-3">Skip to content</a>
    <header class="no-print border-b border-aeblack-200 bg-white">
      <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-4">
        <div class="flex items-center gap-3">
          <span class="text-2xl font-bold text-aegold-800">HourKeep</span>
          <span class="rounded-full border border-aeblack-300 px-2 py-0.5 text-xs text-aeblack-700" id="sample-marker">Sample case HK-2027-0142</span>
        </div>
        <div class="flex gap-2" id="reset-area"></div>
      </div>
    </header>
    <div id="recovered-slot" class="no-print"></div>
    <nav aria-label="Steps" class="no-print mx-auto max-w-4xl px-4 pt-4">
      <ol id="steps" class="grid grid-cols-5 gap-1"></ol>
    </nav>
    <main id="main" tabindex="-1" class="mx-auto max-w-4xl px-4 py-4 pb-24"></main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
